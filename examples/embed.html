<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Burnfolio Embed Example</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0c0f;
        color: #edf1f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(760px, 100%);
        display: grid;
        gap: 18px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #aab4c1;
      }

      img {
        max-width: 100%;
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AI token burn</h1>
      <p>Script embed:</p>
      <script src="BURNFOLIO_ORIGIN/embed/YOUR_PROFILE/script.js"></script>

      <p>Static SVG embed:</p>
      <img src="BURNFOLIO_ORIGIN/embed/YOUR_PROFILE.svg" alt="Burnfolio token burn graph">
    </main>
  </body>
</html>
